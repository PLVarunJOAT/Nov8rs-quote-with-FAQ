<style>
body{margin:0}
.hero{display:grid;gap:6px;margin-bottom:22px}
.hero h1{font-size:34px;margin:2px 0}
.meta{font-size:13px;color:var(--muted)}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:0 0 22px}
.pillar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:6px;align-content:start}
.pillar .k{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.pillar h3{font-family:var(--display);font-size:18px;margin:0;line-height:1.25}
.pillar ul{margin:4px 0 0;padding-left:18px;font-size:14px;color:var(--muted);display:grid;gap:3px}
.pay{border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:20px;display:grid;gap:10px}
.pay .due{font-family:var(--mono);font-size:30px;font-weight:600}
.pay .btn.primary{font-size:16px;padding:14px 22px}
.pay ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted)}
.secure{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.state{text-align:center;padding:48px 16px}
.state h1{margin-inline:auto}
.rail .panel{display:grid;gap:12px}
.still{margin:12px 2px 0;font-size:13.5px;color:var(--muted);text-align:center}
.still a{color:var(--accent);font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .hero>*{animation:fadeUp .6s var(--ease) both}
  .hero>*:nth-child(2){animation-delay:.08s}.hero>*:nth-child(3){animation-delay:.16s}.hero>*:nth-child(4){animation-delay:.22s}
  .pillar{animation:fadeUp .6s var(--ease) both}
  .pillar:nth-child(1){animation-delay:.25s}.pillar:nth-child(2){animation-delay:.35s}.pillar:nth-child(3){animation-delay:.45s}.pillar:nth-child(4){animation-delay:.55s}
  .grid>main{animation:fadeUp .7s var(--ease) .5s both}
  .rail{animation:fadeUp .7s var(--ease) .6s both}
  .pay{animation:payGlow 2.4s var(--ease) 1.2s 1}
  .lines tbody tr{animation:fadeUp .45s var(--ease) both;animation-delay:calc(.6s + var(--r,0) * 40ms)}
  .faqlist.swap details{animation:fadeUp .4s var(--ease) both}
}
.shown .hero>*,.shown .pillar,.shown .grid>main,.shown .rail,.shown .lines tbody tr,.shown .pay{animation:none!important}
.pillar{transition:transform .25s var(--ease),box-shadow .25s}
.pillar:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgb(0 0 0 / .08)}
@keyframes payGlow{0%{box-shadow:0 0 0 0 rgb(226 169 59 / .5)}100%{box-shadow:0 0 0 18px rgb(226 169 59 / 0)}}

@media (max-width:880px){.hero h1{font-size:28px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><a class="chip" href="/"><img src="/brand/nov8rs-logo.jpg" alt="NOV8RS" height="44"></a><span>Your personalised quote</span></div>
  </header>
  <div id="app"><div class="state"><p class="lede">Loading your quote…</p></div></div>
</div>


<div class="nvbot" id="nvbot">
  <div class="nvbot-bubble" role="status" aria-live="polite">
    <button type="button" class="nvbot-x" aria-label="Close message">×</button>
    <span class="nvbot-k" hidden></span>
    <p class="nvbot-t"></p>
  </div>
  <button type="button" class="nvbot-av" aria-label="NOV8RS assistant"><img class="on" src="/brand/mascot/mascot-hug.webp" alt="" draggable="false"><span class="nvbot-shadow"></span></button>
</div>
<script>
/* Quote page assistant: one friendly nudge, then stays out of the way. */
function botSay(text,ms){const b=document.querySelector('#nvbot .nvbot-bubble');if(!b)return;b.querySelector('.nvbot-t').textContent=text;b.classList.add('show');clearTimeout(window._bt);window._bt=setTimeout(()=>b.classList.remove('show'),ms||9000);}
document.querySelector('#nvbot .nvbot-x').onclick=()=>document.querySelector('#nvbot .nvbot-bubble').classList.remove('show');
document.querySelector('#nvbot .nvbot-av').onclick=()=>botSay('Questions about anything here? Tap a question below the price, or book a call. We’re happy to help.',8000);
setTimeout(()=>{document.getElementById('nvbot').classList.add('in');if(window.A)botSay((A.fname?A.fname+', here’s':'Here’s')+' your plan. Everything is priced and ready whenever you are.',9000);},2600);
</script>
<script src="/quote-engine.js"></script>
<script>
const E=createEngine(COMPANY), BR=COMPANY.brand, TX=COMPANY.texts||{};
const {fmt,has,O}=E;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const params=new URLSearchParams(location.search);
const TOKEN=params.get('t')||'';
let A=null, META={}, billing='monthly', paying=false, payErr='';

/* ?demo=1 shows a sample quote without the server, for design checks. */
const DEMO={fname:'Alex',lname:'Rivera',biz:'Rivera Plumbing',email:'alex@example.com',services:['brand','gaseo','infra'],
  br_needs:['website'],web_kind:'ess',web_pages:'7',web_current:'yes',seo_focus:['geo','seo'],seo_scope:'local',seo_gbp:'yes',
  infra_pkg:'pick',ai_tools:['rec','sbi'],ai_crm:'none',timeline:'now',pl_existing:'no'};

const label=(q,v)=>(O(q,v).l)||v;
const labels=(q,arr)=>(arr||[]).map(v=>label(q,v));

/* One card per service the client picked, written from their own answers. */
function pillars(a,r){
  const out=[], skus=new Set(r.lines.map(l=>l.name));
  if(has(a.services,'brand')){
    const items=[];
    if(has(a.br_needs,'kit')) items.push('Complete brand identity kit: logo, brand kit, stationery, social headers, templates and guidelines');
    if(has(a.br_needs,'website')&&a.web_kind) items.push(label('web_kind',a.web_kind)+(a.web_pages?` (${label('web_pages',a.web_pages)})`:''));
    if(has(a.br_needs,'other')) items.push('Your custom branding request: '+(a.br_other||'scoped with you'));
    out.push({k:'Branding & website',h:'A look that matches how good your business is',items});
  }
  if(has(a.services,'mkt')){
    const items=labels('mk_channels',a.mk_channels).map(x=>x==='Something else'?'Your custom marketing request':x);
    if(a.mk_goal) items.push('Goal: '+label('mk_goal',a.mk_goal));
    if(a.ads_platforms&&a.ads_platforms.length) items.push('Ad platforms: '+labels('ads_platforms',a.ads_platforms).join(', '));
    out.push({k:'Marketing',h:'More leads, without you running it',items});
  }
  if(has(a.services,'gaseo')){
    const items=labels('seo_focus',a.seo_focus);
    if(a.seo_scope) items.push(label('seo_scope',a.seo_scope)+(a.seo_locations?` (${a.seo_locations})`:''));
    items.push('Your Google listing set up and kept up to date');
    out.push({k:'Getting found online',h:'Found on Google, Maps and AI apps',items});
  }
  if(has(a.services,'infra')){
    const items=a.infra_pkg==='pick'?labels('ai_tools',a.ai_tools).map(x=>x.replace(/\bmy\b/g,'your')):[label('infra_pkg',a.infra_pkg)+': '+(O('infra_pkg',a.infra_pkg).d||'')];
    if(a.infra_other) items.push('Custom automation: '+a.infra_other);
    out.push({k:'AI & automation',h:'AI that answers, follows up and books for you',items});
  }
  return out;
}

function incList(l){
  if(!l.inc||!l.inc.length) return '';
  return `<details class="inc-list"><summary>What’s included</summary><ul>${l.inc.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details>`;
}
function amt(l,y){
  if(l.contact) return '<span class="inc">Contact for rates</span>';
  if(l.unitPrice&&!l.mo&&!l.once) return fmt(l.unitPrice)+'<span class="inc"> / lead</span>';
  const v=E.rec(l,y); if(!v) return '';
  return (l.from?'<span class="inc">from </span>':'')+fmt(v)+`<span class="inc">${E.per(l,y)}</span>`;
}

function render(){
  const a={...A,billing};
  const r=E.build(a), plan=checkoutPlan(E,r,billing), T=E.totals(r,billing), y=plan.yearly;
  const name=(a.fname||'').trim();
  const valid=META.expires_at?new Date(META.expires_at).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}):'';
  const groups=[...new Set(r.lines.map(l=>l.g))]; let rows='';
  groups.forEach(g=>{rows+=`<tr class="grp"><td colspan="3">${esc(g)}</td></tr>`;
    r.lines.filter(l=>l.g===g).forEach(l=>{
      if(l.included){rows+=`<tr><td>${esc(l.name)}<span class="sku">${esc(l.included)}</span>${incList(l)}</td><td class="money inc">Included</td><td></td></tr>`;return;}
      rows+=`<tr><td>${esc(l.name)}${l.review?' <span class="flag">• we’ll confirm this with you</span>':''}${l.note?`<span class="sku">${esc(l.note)}</span>`:''}${incList(l)}</td>
        <td class="money">${l.once?(l.from?'<span class="inc">from </span>':'')+fmt(l.once):(l.contact?'<span class="inc">Contact for rates</span>':'')}</td>
        <td class="money">${l.contact?'':amt(l,y)}</td></tr>`;});});
  rows+=`<tr class="sum"><td>Total</td><td class="money">${fmt(r.once)}</td><td class="money">${esc(T.text)}</td></tr>`;

  const plat=r.lines.filter(l=>l.annual&&l.sku).map(l=>l.name).join(' + ');
  const toggle=plan.yearlyAllowed?`<div class="billing" role="radiogroup" aria-label="Billing">
     <button type="button" role="radio" aria-checked="${!y}" data-bill="monthly">Monthly</button>
     <button type="button" role="radio" aria-checked="${y}" data-bill="yearly">Yearly${r.yearlySave?` <span class="pill">save ${fmt(r.yearlySave)}</span>`:''}</button></div>`:'';

  let pay;
  if(plan.payable){
    pay=`<div class="pay" id="pay">
      <span class="eyebrow">Ready to start</span>
      <div><small class="note">Due today</small><div class="due">${fmt(plan.dueToday)}</div>
        <small class="note">${[plan.items.filter(i=>!i.interval).length?'One-time setup':'',plan.monthly?'first month of '+fmt(plan.monthly)+'/mo':'',plan.yearlyTotal?'first year of '+fmt(plan.yearlyTotal)+'/yr':''].filter(Boolean).join(' + ')}</small></div>
      ${plan.later.length?`<ul>${plan.later.map(x=>`<li>${esc(x.name)}: ${esc(x.text)}</li>`).join('')}</ul>`:''}
      <button class="btn primary" id="paybtn" ${paying?'disabled':''}>${paying?'Opening secure checkout…':'Pay '+fmt(plan.dueToday)+' and get started'}</button>
      ${payErr?`<p class="err" style="margin:0">${esc(payErr)}</p>`:''}
      <span class="secure"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Secure payment by Stripe</span>
      </div>
      <p class="still">Still have questions? <a href="${esc(BR.bookingUrl)}" target="_blank" rel="noopener">Book a call</a></p>`;
  }else if(plan.reason==='enterprise'){
    const ent=TX.enterprise||{};
    pay=`<div class="pay"><span class="eyebrow">Next step</span><h2 style="margin:0">${esc(ent.title||'Book your strategy meeting')}</h2><p style="margin:0">${esc(ent.body||'')}</p>
      <div><a class="btn primary" href="${esc(BR.bookingUrl)}" target="_blank" rel="noopener">${esc(ent.cta||'Book a strategy meeting')}</a></div></div>`;
  }else{
    pay=`<div class="pay"><span class="eyebrow">One quick step</span><h2 style="margin:0">Let’s confirm a few details</h2>
      <p style="margin:0">These items depend on details we confirm with you before you pay: ${esc(plan.blocked.join(', '))}. Book a short call, or reply to the email, and we’ll send your final payment link.</p>
      <div><a class="btn primary" href="${esc(BR.bookingUrl)}" target="_blank" rel="noopener">Book a call with us</a></div></div>`;
  }

  const notes=E.notes(a,r).filter(n=>n.kind!=='saving').map(n=>`<p class="note">${esc(n.text)}</p>`).join('');
  const saving=E.notes(a,r).filter(n=>n.kind==='saving').map(n=>`<div class="saving">${esc(n.text)}</div>`).join('');
  const cards=pillars(a,r).map(p=>`<div class="pillar"><span class="k">${esc(p.k)}</span><h3>${esc(p.h)}</h3>${p.items.length?`<ul>${p.items.map(x=>`<li>${esc(x.replace(/\bmy\b/g,'your'))}</li>`).join('')}</ul>`:''}</div>`).join('');

  $('#app').innerHTML=`
  <section class="hero">
    <span class="eyebrow">${META.quote_id?'Quote '+esc(META.quote_id):'Your quote'}</span>
    <h1>${name?esc(name)+', here’s':'Here’s'} your growth plan${a.biz?' for '+esc(a.biz):''}</h1>
    <p class="lede" style="margin:0">Built from what you told us. ${plan.payable?'Everything is priced, and you can start today.':'Have a look, and we’ll confirm a few details with you before you start.'}</p>
    ${valid?`<span class="meta">Prices held until ${esc(valid)}</span>`:''}
  </section>
  <div class="pillars">${cards}</div>
  <div class="grid">
    <main><div class="panel">
      <h2 style="margin-top:0">What it costs</h2>
      ${toggle}
      ${saving}
      <div class="tablewrap"><table class="lines"><thead><tr><th>Product &amp; deliverables</th><th class="r">One-time</th><th class="r">Recurring</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${y&&TX.yearlyHint?`<p class="note">${esc(TX.yearlyHint)}</p>`:''}
      ${notes}
      ${faqHtml(a)}
    </div></main>
    <aside class="rail">${pay}</aside>
  </div>`;
  document.querySelectorAll('[data-bill]').forEach(b=>b.onclick=()=>{billing=b.dataset.bill;payErr='';render();});
  const pb=$('#paybtn'); if(pb) pb.onclick=checkout;
  if(!document.body.classList.contains('shown')) setTimeout(()=>document.body.classList.add('shown'),2000);
}

let FAQ_T=null;
function faqHtml(a){
  const H=COMPANY.help; const ts=[...H.selectedTopics(a),'billing'];
  if(!ts.includes(FAQ_T)) FAQ_T=ts[0];
  return `<div class="faqbox" style="margin-top:22px"><h2 style="margin:0 0 10px">Questions about your plan</h2>
    <div class="ftabs" role="tablist">${ts.map(t=>`<button type="button" role="tab" aria-selected="${t===FAQ_T}" data-ftab="${t}">${esc(H.topics[t].short)}</button>`).join('')}</div>
    <div class="faqlist">${H.faq[FAQ_T].map(([qq,aa])=>`<details><summary>${esc(qq)}</summary><p>${esc(aa)}</p></details>`).join('')}</div></div>`;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-ftab]');if(!b||!A)return;FAQ_T=b.dataset.ftab;const y=window.scrollY;render();window.scrollTo(0,y);const fl=document.querySelector('.faqlist');if(fl)fl.classList.add('swap');});

async function checkout(){
  if(DEMO_MODE){payErr='Demo mode: checkout is turned off.';render();return;}
  paying=true;payErr='';render();
  try{
    const res=await fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({t:TOKEN,billing})});
    const j=await res.json().catch(()=>({}));
    if(!res.ok||!j.url) throw new Error(j.error||'Could not open checkout.');
    location.href=j.url;
  }catch(e){paying=false;payErr=e.message+' Please try again, or email '+BR.email+'.';render();}
}

function stateScreen(title,body){
  $('#app').innerHTML=`<div class="panel state"><h1>${esc(title)}</h1><p class="lede" style="margin-inline:auto">${esc(body)}</p>
    <div class="nav" style="justify-content:center"><a class="btn primary" href="/">Build a new quote</a><a class="btn" href="${esc(BR.bookingUrl)}" target="_blank" rel="noopener">Book a call</a></div></div>`;
}

const DEMO_MODE=params.get('demo')==='1';
(async function init(){
  if(DEMO_MODE){A=DEMO;window.A=A;META={quote_id:'NV-DEMO',expires_at:Date.now()+30*864e5};render();return;}
  if(!TOKEN) return stateScreen('Open your quote from the email','Your quote has its own private link. Open the “View my quote” button in the email we sent you.');
  try{
    const res=await fetch('/api/quote-view?t='+encodeURIComponent(TOKEN));
    const j=await res.json().catch(()=>({}));
    if(res.status===410) return stateScreen('This quote has expired','Prices are held for a limited time. Build a fresh quote in a couple of minutes, or book a call and we’ll update it for you.');
    if(!res.ok) return stateScreen('We couldn’t open this quote','The link may be incomplete. Try clicking the button in your email again, or build a new quote.');
    A=j.answers;window.A=A;META=j;billing=A.billing==='yearly'?'yearly':'monthly';render();
  }catch(e){stateScreen('We couldn’t load your quote','Please check your connection and refresh the page.');}
})();
</script>
</body>
</html>
