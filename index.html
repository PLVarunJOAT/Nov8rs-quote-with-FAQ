async function submitQuote(){
  const sig=quoteSig(); if(SUB.sig===sig&&SUB.state!=='error') return;
  SUB={...SUB,sig};
  if(!QUOTE_ENDPOINT){SUB.state='preview';if(cur===activeSecs().length)render();return;}
  SUB.state='sending';
  const answers=Object.fromEntries(Object.entries(A).filter(([k])=>!k.startsWith('_')));
  const o=packOffer(A);
  try{
    const res=await fetch(QUOTE_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      quote_id:SUB.quote_id||null,answers,
      consent:{email:!!A.consent,email_text:Q.consent.text,sms:!!(A.sms_consent&&String(A.phone||'').replace(/\D/g,'').length>=10),sms_text:A.sms_consent?Q.sms_consent.text:null,at:A.consent_at||null},
      offer:{shown:o?o.sku:null,accepted:A._offerTaken?A._offerTaken.sku:null},
      quote:quotePayload(),

    const j=await res.json().catch(()=>({}));

    SUB={...SUB,state:'sent',quote_id:j.quote_id||SUB.quote_id,invoice_url:j.invoice_url||'',status:j.status||''};

}

}
function offerCard(){
  const o=packOffer(A); if(!o) return '';
  A._offer={sku:o.sku,shown:true,accepted:false};
  return `<div class="offer"><span class="ot">Recommended for you · save ${fmt(o.save)}/mo</span><h2>${esc(o.head)}</h2><p>${esc(o.body)}</p>
   <div class="row"><button class="btn primary" id="take-offer">${esc(o.cta)}</button><span class="note">A few quick questions, then your updated quote.</span></div></div>`;
}
function takeOffer(){
  const o=packOffer(A); if(!o||!o.apply) return;
  const target=o.apply(A);
  A._offerTaken={sku:o.sku,at:new Date().toISOString()};
  if(target){A._jump=target;const secs=activeSecs();cur=Math.max(0,secs.findIndex(x=>x.id===target));}
  prevVisible=new Set(); render(); scrollTop();
}

/* ---- Quote data sent to the server / CRM (the client never sees prices on screen) ---- */
function quotePayload(){
  const r=build(A),T=ENGINE.totals(r,A.billing);
  const amt=l=>l.contact?'Contact for rates':l.unitPrice&&!l.mo?fmt(l.unitPrice)+' '+l.unitText:'';
  const lines=r.lines.map(l=>({group:l.g,sku:l.sku||null,name:l.name,qty:l.qty||1,
    one_time:l.once||0,recurring:ENGINE.rec(l,T.y)||0,per:ENGINE.rec(l,T.y)?ENGINE.per(l,T.y):'',
    starting_price:!!l.from,needs_review:!!l.review,included:l.included||null,note:l.note||amt(l)||'',deliverables:l.inc||[]}));
  const o=packOffer(A);
  const offerTxt=o?`${o.head}. ${o.body}`:'';
  const notes=ENGINE.notes(A,r).map(n=>n.text);
  const money=(l)=>l.included?'Included':l.contact?'Contact for rates':[l.one_time?(l.starting_price?'from ':'')+fmt(l.one_time)+' one-time':'',l.recurring?(l.starting_price?'from ':'')+fmt(l.recurring)+l.per:'',(!l.one_time&&!l.recurring&&l.note)?l.note:''].filter(Boolean).join(' + ');
  const text=[`Quote for ${fullName()||A.email}${A.biz?' ('+A.biz+')':''}`,'',
    ...lines.map(l=>`- ${l.name}: ${money(l)}${l.needs_review?' (needs review)':''}`),'',
    `Due to start: ${fmt(T.due)}`,`One-time total: ${fmt(r.once)}`,`Recurring: ${T.text}`,
    ...(notes.length?['',...notes]:[]),...(offerTxt?['','Recommended: '+offerTxt]:[])].join('\n');
  const td='padding:8px 10px;border-bottom:1px solid #e6e1d6;font:14px Arial,sans-serif;color:#121212;vertical-align:top';
  const rows=[...new Set(lines.map(l=>l.group))].map(g=>
    `<tr><td colspan="2" style="${td};font-weight:bold;background:#f6f1e4">${esc(g)}</td></tr>`+
    lines.filter(l=>l.group===g).map(l=>`<tr><td style="${td}">${esc(l.name)}${l.needs_review?' <span style="color:#b4570f">(needs review)</span>':''}${l.note&&!l.included?`<br><span style="color:#6b665d;font-size:12px">${esc(l.note)}</span>`:''}</td><td style="${td};text-align:right;white-space:nowrap">${esc(money(l))}</td></tr>`).join('')).join('');
  const html=`<table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;max-width:640px;border-collapse:collapse;border:1px solid #e6e1d6">${rows}
<tr><td style="${td};font-weight:bold">Due to start</td><td style="${td};text-align:right;font-weight:bold">${fmt(T.due)}</td></tr>
<tr><td style="${td}">One-time total</td><td style="${td};text-align:right">${fmt(r.once)}</td></tr>
<tr><td style="${td}">Recurring</td><td style="${td};text-align:right">${esc(T.text)}</td></tr></table>`+
    (notes.length?`<p style="font:13px Arial,sans-serif;color:#6b665d">${notes.map(esc).join('<br>')}</p>`:'')+
    (offerTxt?`<p style="font:14px Arial,sans-serif;color:#121212;background:#f6ecd6;padding:12px;border-radius:8px"><b>Recommended for you:</b> ${esc(offerTxt)}</p>`:'');
  return {lines,totals:{due_to_start:T.due,one_time:r.once,monthly:T.mo,yearly:T.yr,recurring_text:T.text,billing:T.label},
    needs_review:r.review.length>0,enterprise:!!r.ent,text,html,
    summary:{due_to_start:fmt(T.due),one_time:fmt(r.once),recurring:T.text}};
}

function renderThanks(){
  const r=build(A);
  if(SUB.sig!==quoteSig()) setTimeout(submitQuote,0);
  const name=(A.fname||'').trim();
  const st=SUB.state;
  if(st==='error') return `<div class="done"><div class="tick" style="background:var(--warm-soft);color:var(--warm)">!</div>
    <h1>We couldn’t send your quote just now</h1>
    <p class="lede" style="margin-inline:auto">Please try again in a minute, or email ${esc(BR.email)} and we’ll send it over.</p>
    <div class="nav" style="justify-content:center"><button class="btn" id="back">Back</button><button class="btn primary" id="retry">Try again</button></div></div>`;
  if(st==='sending'||st==='idle') return `<div class="done"><div class="tick">…</div><h1>Sending your quote…</h1><p class="lede" style="margin-inline:auto">This only takes a moment.</p></div>`;
  const steps=r.ent
    ?['Open the email from NOV8RS and click “View my quote”.','See your plan and next steps, including how we’ll scope your program together.','You get a final proposal before anything is invoiced.']
    :r.review.length
    ?['Open the email from NOV8RS and click “View my quote”.','We confirm the items that need a quick check with you, usually within one business day.','Then you can pay securely online and we kick off.']
    :['Open the email from NOV8RS and click “View my quote”.','Review your plan, pricing and what’s included.','Pay securely online, and we kick off right away.'];
  return `<div class="done">
    <div class="tick tick-anim"><svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-16"/></svg></div>
    <div class="eyebrow">Quote sent</div>
    <h1>Thank you${name?', '+esc(name):''}!</h1>
    <p class="lede" style="margin-inline:auto">Your personalised quote is on its way to <b>${esc(A.email)}</b>. Open the link in that email to see your pricing and get started. It can take a few minutes to arrive, so check spam or promotions if you don’t see it.</p>
    <ol class="next">${steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
    <p class="note" style="margin-top:14px">Tip: add <b>${esc(BR.email)}</b> to your contacts so your quote doesn’t land in spam.</p>
    ${st==='preview'?'<p class="note">Preview mode: nothing was sent. Connect the quote server to email real quotes.</p>':''}
  </div>`;
}
function bindThanks(){
  const rt=$('#retry');if(rt)rt.onclick=()=>{SUB.sig='';SUB.state='sending';render();submitQuote();};
  const b=$('#back');if(b)b.onclick=()=>{cur--;render();scrollTop();};
}
function bindQuote(){
  const to=$('#take-offer'); if(to) to.onclick=takeOffer;
  document.querySelectorAll('[data-bill]').forEach(b=>b.onclick=()=>{A.billing=b.dataset.bill;render();});
  const b=$('#back');if(b)b.onclick=()=>{cur--;render();scrollTop();};
  const rt=$('#retry');if(rt)rt.onclick=()=>{SUB.sig='';submitQuote();};
  const c=$('#copy');if(c)c.onclick=()=>{const r=build(A),T=ENGINE.totals(r,A.billing);
    const t=[`Quote ${SUB.quote_id||''}${A.biz?': '+A.biz:''}`,`Prepared for ${fullName()?fullName()+' ':''}<${A.email}>`,'',
      ...r.lines.filter(l=>l.sku).map(l=>`${l.name} | ${l.contact?'Contact for rates':l.unitPrice?fmt(l.unitPrice)+' '+l.unitText:(l.once?(l.from?'from ':'')+fmt(l.once):'-')} | ${ENGINE.rec(l,T.y)?(l.from?'from ':'')+fmt(ENGINE.rec(l,T.y))+ENGINE.per(l,T.y):'-'}${l.review?' (needs review)':''}`),'',
      `Billing: ${T.label}`,`Due to start: ${fmt(T.due)}`,`One-time: ${fmt(r.once)}`,`Recurring: ${T.text}`].join('\n');
    const m=$('#copied');
    navigator.clipboard.writeText(t).then(()=>{m.hidden=false;m.textContent='Copied to clipboard.';})
      .catch(()=>{m.hidden=false;m.innerHTML='<textarea class="txt" rows="8" readonly>'+esc(t)+'</textarea>';m.querySelector('textarea').select();});};
}


/* ---- Mascot assistant: reacts to choices, shares one tip at a time, never repeats a tip ---- */
const BOT=(function(){
  const noop={setTopics(){},onStep(){},onPick(){},onError(){},onDone(){}};
  const root=document.getElementById('nvbot'), IMG=window.NV_MASCOT||{};
  if(!root||!IMG.idle) return noop;
  const R=HELP.reactions||{}, TIPS=HELP.tips||[];
  const av=root.querySelector('.nvbot-av'), bub=root.querySelector('.nvbot-bubble'),
        kick=root.querySelector('.nvbot-k'), txt=root.querySelector('.nvbot-t'), more=root.querySelector('.nvbot-more');
  av.innerHTML=['idle','wave','hug','think','celebrate'].map(p=>`<img data-p="${p}" src="${IMG[p]}" alt="" draggable="false">`).join('')+'<span class="nvbot-shadow"></span>';
  let off=false; try{off=localStorage.getItem('nv-tips-off')==='1'}catch(e){}
  const shown=new Set(); let topics=[], hideT=null, idleT=null, lastSay=0, moreTopic=null, halfSaid=false;
  const mobile=()=>window.innerWidth<640;
  function pose(p){av.querySelectorAll('img').forEach(i=>i.classList.toggle('on',i.dataset.p===p));if(!reduceMotion()){av.classList.remove('bump');void av.offsetWidth;av.classList.add('bump');}}
  function say(text,o={}){
    if(off&&!o.force) return;
    kick.textContent=o.k||''; kick.hidden=!o.k; txt.textContent=text;
    moreTopic=o.topic||null; more.hidden=!moreTopic;
    pose(o.p||'idle'); bub.classList.remove('show'); void bub.offsetWidth; bub.classList.add('show');
    root.classList.add('talking'); lastSay=Date.now();
    clearTimeout(hideT); hideT=setTimeout(hide,o.ms||(mobile()?6500:8500));
  }
  function hide(){bub.classList.remove('show');root.classList.remove('talking');pose('idle');}
  function nextTip(force){
    let pool=TIPS.filter(([t],i)=>topics.includes(t)&&!shown.has(i));
    if(!pool.length) pool=TIPS.filter((x,i)=>!shown.has(i));
    if(!pool.length){shown.clear();pool=TIPS.slice();}
    const pick=pool[Math.floor(Math.random()*pool.length)], idx=TIPS.indexOf(pick); shown.add(idx);
    say(pick[1],{k:'Did you know?',p:'think',topic:topics.includes(pick[0])&&HELP.faq[pick[0]]?pick[0]:null,force,ms:mobile()?8000:11000});
  }
  function armIdle(){clearTimeout(idleT);if(off) return;idleT=setTimeout(()=>{if(Date.now()-lastSay>8000) nextTip();armIdle();},mobile()?38000:20000);}
  ['click','keydown','scroll'].forEach(ev=>window.addEventListener(ev,()=>armIdle(),{passive:true}));
  av.addEventListener('click',()=>{if(bub.classList.contains('show')&&!moreTopic) hide(); else nextTip(true);});
  root.querySelector('.nvbot-x').addEventListener('click',hide);
  root.querySelector('.nvbot-off').addEventListener('click',()=>{off=true;try{localStorage.setItem('nv-tips-off','1')}catch(e){}hide();root.classList.add('quiet');});
  more.addEventListener('click',()=>{if(!moreTopic) return; FAQ_T=moreTopic; FAQ_SWAP=true; const y=window.scrollY; render(); window.scrollTo(0,y); hide();
    const f=$('#faq'); if(f) f.scrollIntoView({behavior:reduceMotion()?'auto':'smooth',block:'start'});});
  if(off) root.classList.add('quiet');
  setTimeout(()=>{root.classList.add('in');const g=R.greet||[];say(g[Math.floor(Math.random()*g.length)]||'Hi there!',{p:'wave',ms:9000});armIdle();},900);
  return {
    setTopics(t){topics=t||[];},
    onStep(i,n,sid){
      if(sid==='optin') return say(R.almost,{p:'hug'});
      if(!halfSaid&&i>0&&i>=Math.floor(n/2)){halfSaid=true;return say(R.half,{p:'hug',ms:5000});}
    },
    onPick(qid,v,key){
      const pairs=((HELP.suggest||{})[qid]||{})[v]||[]; const val=A[qid];
      const chosen=Array.isArray(val)?val:[val];
      const done=pairs.some(p=>chosen.includes(p)) || Object.entries((HELP.suggest||{})[qid]||{}).some(([k,ps])=>k!==v&&chosen.includes(k)&&ps.includes(v));
      if(done) return say(R.pairDone,{p:'celebrate',ms:6000});
      const name=pairs.length?((Q[qid].opts.find(o=>o.v===pairs[0])||{}).l||''):'';
      say(((R.pick||{})[key]||'Great pick.')+(name?` It pairs well with ${name}, highlighted for you.`:''),{p:'hug',ms:7000});
    },
    onError(){say(R.stuck,{p:'think',ms:5000,force:true});},
    onDone(){clearTimeout(idleT);say(R.done,{p:'celebrate',ms:12000,force:true});}
  };
})();
/* Gold confetti burst on the thank-you screen */
function confetti(){
  if(reduceMotion()) return; const box=document.createElement('div'); box.className='confetti'; box.setAttribute('aria-hidden','true');
  const cols=['#E2A93B','#F5C25A','#FFE3A1','#B07A1A','#FFFFFF'];
  for(let i=0;i<70;i++){const p=document.createElement('i');p.style.left=(Math.random()*100)+'%';p.style.background=cols[i%cols.length];
    p.style.setProperty('--d',(1.6+Math.random()*1.6)+'s');p.style.setProperty('--x',(Math.random()*160-80)+'px');p.style.setProperty('--r',(Math.random()*720-360)+'deg');
    p.style.animationDelay=(Math.random()*.4)+'s';p.style.width=p.style.height=(6+Math.random()*6)+'px';if(i%3===0)p.style.borderRadius='50%';box.appendChild(p);}
  document.body.appendChild(box); setTimeout(()=>box.remove(),4200);
}

if(location.hash==='#rules'){$('#logic-wrap').hidden=false;}
$('#logic-toggle').onchange=e=>document.body.classList.toggle('showlogic',e.target.checked);
if(QUOTE_ENDPOINT){const pr=$('#preview-ribbon');if(pr)pr.hidden=true;}
render();
